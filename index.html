<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeBuddy - FAQ Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <div class="logo">🤖</div>

            <div>
                <h2>askcodec</h2>
                <p>FAQ Assistant</p>
            </div>
        </div>

        <h3>Quick Questions</h3>

        <button class="quick-side"
                onclick="quickQuestion('What is CodeAlpha?')">
            What is CodeAlpha?
        </button>

        <button class="quick-side"
                onclick="quickQuestion('What are the AI tasks?')">
            What are the AI tasks?
        </button>

        <button class="quick-side"
                onclick="quickQuestion('What is NLTK?')">
            What is NLTK?
        </button>

        <button class="quick-side"
                onclick="quickQuestion('Where do I upload my code?')">
            Where do I upload my code?
        </button>

        <div class="online">
            <span></span>
            Bot is online
        </div>

    </aside>


    <!-- CHAT AREA -->
    <main class="chat-area">

        <!-- HEADER -->
        <header class="chat-header">

            <div class="bot-icon">
                🤖
            </div>

            <div>
                <h1>askcodec</h1>
                <p>Your friendly FAQ chatbot</p>
            </div>

        </header>


        <!-- CHAT MESSAGES -->
        <section class="chat-box" id="chatBox">

            <div class="message bot">

                <div class="avatar">
                    🤖
                </div>

                <div class="bubble">

                    Hi! 👋 I'm <b>CodeBuddy</b>.

                    <br><br>

                    Ask me anything about your
                    <b>CodeAlpha AI Internship.</b>

                </div>

            </div>

        </section>


        <!-- QUICK BUTTONS -->
        <div class="quick-buttons">

            <button onclick="quickQuestion('What are the AI tasks?')">
                📋 AI Tasks
            </button>

            <button onclick="quickQuestion('What is NLTK?')">
                🧠 NLTK
            </button>

            <button onclick="quickQuestion('Will I get a certificate?')">
                🎓 Certificate
            </button>

        </div>


        <!-- INPUT -->
        <form class="input-area" onsubmit="sendMessage(event)">

            <input
                type="text"
                id="userInput"
                placeholder="Type your question..."
                autocomplete="off"
            >

            <button type="submit">
                ➤
            </button>

        </form>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
